<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" role="img" aria-labelledby="ga-title ga-desc">
<title id="ga-title">Omics2PK — testing whether molecular phenotype improves tacrolimus pharmacokinetic prediction</title>
<desc id="ga-desc">Matched patient clinical data and measured CYP3A4 and CYP3A5 genotypes are compared with and without genuine pre-landmark molecular measurements from MultiOmics. Same patients and folds enter an out-of-sample comparison on measured tacrolimus dose and concentration PK endpoints. The decisive gain over clinical and genotype is not yet demonstrated; access to a paired original tacrolimus PK and omics cohort remains the limiting step.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf9"/><stop offset="1" stop-color="#f8f4ee"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#276f75"/><stop offset="1" stop-color="#a95b45"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" stroke="#6c8791" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#153c4b" flood-opacity=".09"/></filter>
</defs>
<rect width="1500" height="800" rx="24" fill="url(#bg)"/>
<rect width="1500" height="12" fill="url(#accent)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="58" y="65" font-size="19" letter-spacing="2.4" font-weight="700" fill="#27737a">PRECISION PHARMACOKINETICS · RESEARCH</text>
<text x="58" y="134" font-size="56" font-weight="700" fill="#153842">Omics2PK</text>
<text x="392" y="127" font-size="25" fill="#4e6870">Do molecular phenotypes improve tacrolimus PK beyond CYP3A genotype?</text>
<line x1="60" y1="161" x2="1440" y2="161" stroke="#d8e3e4" stroke-width="2"/>
<text x="62" y="206" font-size="19" font-weight="700" letter-spacing="1.6" fill="#58727a">01   MATCHED PATIENT DATA</text>
<text x="543" y="206" font-size="19" font-weight="700" letter-spacing="1.6" fill="#58727a">02   FAIR MODEL COMPARISON</text>
<text x="1094" y="206" font-size="19" font-weight="700" letter-spacing="1.6" fill="#58727a">03   MEASURED PK</text>
<!-- Input card -->
<rect x="55" y="226" width="405" height="390" rx="22" fill="#fff" stroke="#dce5e6" stroke-width="2" filter="url(#shadow)"/>
<rect x="80" y="251" width="355" height="93" rx="15" fill="#faeee7"/>
<circle cx="119" cy="295" r="24" fill="#aa5c45"/>
<text x="119" y="304" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">G</text>
<text x="158" y="284" font-size="24" font-weight="700" fill="#213e45">Clinical + PGx</text>
<text x="158" y="315" font-size="19" fill="#546971">CYP3A4/5 alleles · covariates</text>
<rect x="80" y="361" width="355" height="111" rx="15" fill="#eaf3f2"/>
<circle cx="119" cy="402" r="24" fill="#2a7d80"/>
<path d="M108 398 C127 390 113 420 132 410 M110 411 C131 421 117 388 130 396" stroke="#fff" stroke-width="2.7" fill="none" stroke-linecap="round"/>
<text x="158" y="393" font-size="23" font-weight="700" fill="#213e45">Molecular state</text>
<text x="158" y="423" font-size="18" fill="#546971">RNA · proteins · metabolites</text>
<text x="158" y="449" font-size="17" fill="#2d7475" font-weight="700">Pre-landmark, matched only</text>
<rect x="80" y="490" width="355" height="100" rx="15" fill="#f1f3f5"/>
<path d="M97 552 L118 532 L135 541 L151 513" fill="none" stroke="#5b7682" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="151" cy="513" r="5" fill="#aa5c45"/>
<text x="167" y="527" font-size="22" font-weight="700" fill="#213e45">Tacrolimus dosing</text>
<text x="167" y="557" font-size="18" fill="#546971">Dose · C(t) · sampling time</text>
<!-- Transition -->
<path d="M472 409 H519" stroke="#6c8791" stroke-width="3" marker-end="url(#arrow)"/>
<!-- Comparison card -->
<rect x="533" y="226" width="515" height="390" rx="22" fill="#fff" stroke="#dce5e6" stroke-width="2" filter="url(#shadow)"/>
<rect x="563" y="258" width="455" height="94" rx="15" fill="#f9efe9" stroke="#edcabb" stroke-width="1.5"/>
<rect x="577" y="271" width="8" height="68" rx="4" fill="#aa5c45"/>
<text x="601" y="298" font-size="24" font-weight="700" fill="#213e45">Reference PopPK / predictor</text>
<text x="601" y="330" font-size="19" fill="#5e7075">Clinical + observed CYP3A PGx</text>
<path d="M791 363 V388" stroke="#6c8791" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="563" y="396" width="455" height="103" rx="15" fill="#eaf3f2" stroke="#bbdad5" stroke-width="1.5"/>
<rect x="577" y="410" width="8" height="76" rx="4" fill="#2b8180"/>
<text x="601" y="438" font-size="24" font-weight="700" fill="#213e45">Reference + omic covariate</text>
<text x="601" y="469" font-size="19" fill="#5e7075">Scores · XGBoost · graphs if valid</text>
<rect x="561" y="525" width="461" height="66" rx="14" fill="#edf2f5"/>
<circle cx="590" cy="557" r="16" fill="#5d7581"/>
<path d="M584 557 L589 562 L598 551" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="620" y="550" font-size="21" font-weight="700" fill="#24434b">Same patients + held-out folds</text>
<text x="620" y="576" font-size="17" fill="#5d727b">Train-only fitting; no subject leakage</text>
<!-- Arrow -->
<path d="M1060 409 H1090" stroke="#6c8791" stroke-width="3" marker-end="url(#arrow)"/>
<!-- Evaluation card -->
<rect x="1103" y="226" width="340" height="390" rx="22" fill="#fff" stroke="#dce5e6" stroke-width="2" filter="url(#shadow)"/>
<text x="1130" y="274" font-size="26" font-weight="700" fill="#213e45">PK performance</text>
<text x="1130" y="306" font-size="18" fill="#58727a">Observed tacrolimus targets</text>
<rect x="1130" y="336" width="286" height="65" rx="14" fill="#edf4f3"/>
<text x="1155" y="379" font-size="26" font-weight="700" fill="#257277">AUC · CL/F</text>
<rect x="1130" y="415" width="286" height="65" rx="14" fill="#edf4f3"/>
<text x="1155" y="458" font-size="25" font-weight="700" fill="#257277">C(t) · troughs</text>
<text x="1131" y="520" font-size="22" font-weight="700" fill="#213e45">Δ held-out error</text>
<text x="1131" y="550" font-size="18" fill="#58727a">Bias · uncertainty · external test</text>
<rect x="1130" y="566" width="285" height="26" rx="13" fill="#f7eee6"/>
<text x="1272" y="584" font-size="16" font-weight="700" fill="#956249" text-anchor="middle">No superiority claim yet</text>
<!-- Footer -->
<rect x="57" y="650" width="1386" height="102" rx="20" fill="#193c45"/>
<rect x="77" y="672" width="8" height="59" rx="4" fill="#d58962"/>
<text x="110" y="684" fill="#fff" font-size="24" font-weight="700">Decision gate: molecular benefit beyond genotype?</text>
<text x="110" y="719" fill="#d7e5e6" font-size="21">True paired tacrolimus omics + PK cohort still needed; mechanistic evidence alone is insufficient.</text>
</g>
</svg>