<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ga-title ga-desc">
<title id="ga-title">Omics2PK — general molecular-to-pharmacokinetic prediction research workflow</title>
<desc id="ga-desc">General workflow for many drugs: clinical data, pharmacogenetics, transcriptomics, proteomics and metabolomics feed direct molecular features, prespecified functional scores, RNA-only networks or multiomics latent factors. These are compared with clinical and PGx reference models, penalized regression, machine learning and eventual population PK on the same individuals and held-out folds, evaluated with actual measured AUC, CL over F, trough and concentration-time observations. Tacrolimus and CYP3A are only one case study. Omic superiority over clinical and genotype is not yet demonstrated.</desc>
<defs>
