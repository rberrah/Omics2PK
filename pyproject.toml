[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omics2pk"
version = "0.1.0a0"
description = "Offline research bridge from MultiOmics v1 to downstream omics/PK methods"
requires-python = ">=3.11"
authors = [{name = "Omics2PK contributors"}]
dependencies = []

[project.scripts]
omics2pk = "omics2pk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
sweet-inductive = ["numpy==2.3.5"]
