name: Real Rotroff human PK nested 80-90pct minimal molecular budget
on:
  pull_request:
    paths:
      - "src/omics2pk/information_budget.py"
      - "src/omics2pk/rotroff33_nested_information_budget.py"
      - "scripts/validate_rotroff33_nested_information_budget.py"
      - "scripts/plot_original_information_budget.py"
      - "tests/test_information_budget.py"
      - ".github/workflows/rotroff33-nested-information-budget.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-metformin-nested-shap-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Pin original XGBoost TreeSHAP and plotting dependencies
        run: |
          python -m pip install -e .
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2' 'xgboost==3.0.5' 'matplotlib==3.10.7'
      - name: Offline source contracts for true 80-90 percent predictive gain
        run: python -m unittest discover -s tests -p 'test_information_budget.py' -v
      - name: Original clinical metformin AUC and CLr n32 nested LOOCV fixed full curve and 80-90pct models
        run: |
          set -o pipefail
          python -m scripts.validate_rotroff33_nested_information_budget | tee rotroff33_nested_80_90pct_budget_aggregate.json
      - name: Verify no patient leakage and full source feature count
        run: |
          python - <<'PY'
          import json
          r=json.load(open('rotroff33_nested_80_90pct_budget_aggregate.json'))
          assert r['status'].startswith('ORIGINAL_')
          assert len(r['endpoints'])==2
          assert not r['clinical_dosing_value_demonstrated']
          for endpoint,value in r['endpoints'].items():
              assert value['n_unique_people']==32
              assert value['n_source_original_omic_fields']==384
              assert value['number_outer_leave_one_person_out_folds']==32
              assert value['outer_patient_biomarker_used_in_feature_ranking'] is False
              assert value['outer_patient_biomarker_used_in_choice_of_k'] is False
              assert value['individual_patient_concentrations_intensities_or_predictions_exported'] is False
              assert set(value['adaptive_gain_retention_budgets'])=={'80','90'}
              for selection in value['adaptive_gain_retention_budgets'].values():
                  assert sum(selection['outer_fold_selected_k_frequency'].values())==32
              panel=selection['panel_selection_stability_train_only_descriptive']
              assert panel['n_model_fits']==32
              assert panel['n_zero_omic_panels']==selection['n_outer_folds_using_zero_omic_features']
              assert panel['n_nonempty_panels']+panel['n_zero_omic_panels']==32
              assert panel['used_to_choose_panel_or_evaluate_predictive_gain'] is False
              assert panel['overlapping_train_folds_invalidate_independence_or_significance_claims']
          assert 0<=value['mean_inner_top10_SHAP_rank_Jaccard_train_only_descriptive']<=1
          assert value['independent_reproducibility_of_biomarker_identity_demonstrated'] is False
          print('PASS: source-original 80/90% inner gain is distinct from test gain')
          PY
      - name: Plot aggregate-heldout information Pareto and public model SHAP heatmap (no individual profiles)
        run: python -m scripts.plot_original_information_budget --aggregate rotroff33_nested_80_90pct_budget_aggregate.json --outdir figures
      - uses: actions/upload-artifact@v6
        with:
          name: original-Rotroff-human-PK-nested-80-90-percent-omics-aggregate-and-figures
          path: |
            rotroff33_nested_80_90pct_budget_aggregate.json
            figures/*.png
          retention-days: 28
