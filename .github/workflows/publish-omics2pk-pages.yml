name: Publish Omics2PK website to GitHub Pages (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/test_omics2pk_pages.py'
      - '.github/workflows/publish-omics2pk-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: omics2pk-github-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exactly pinned local PMx Fontsource packages
        run: npm install --prefix site --ignore-scripts --no-audit --no-fund --omit=dev
      - name: Qualify research website and bundle the exact variable font families
        run: |
          python site/build_site.py --out site/dist
          node site/scripts/bundle_fonts.mjs site/dist
          python -m unittest discover -s tests -p 'test_omics2pk_pages.py' -v
          test -s site/dist/assets/fonts/inter-latin-wght-normal.woff2
          test -s site/dist/assets/fonts/source-serif-4-latin-wght-normal.woff2
          test -s site/dist/assets/fonts/jetbrains-mono-latin-wght-normal.woff2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
