name: Original mavoglurant human-heldout IV structural 1C/2C benchmark
on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/omics2pk/iv_pk_structural.py"
      - "scripts/benchmark_mavoglurant_iv_structural.py"
      - "tests/test_iv_pk_structural.py"
      - "tests/test_mavoglurant_structural_fit.py"
      - ".github/workflows/mavoglurant-heldout-structural.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/omics2pk/iv_pk_structural.py"
      - "scripts/benchmark_mavoglurant_iv_structural.py"
      - "tests/test_iv_pk_structural.py"
      - "tests/test_mavoglurant_structural_fit.py"
      - ".github/workflows/mavoglurant-heldout-structural.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-iv-structural:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned structural benchmark numerical and RDA dependencies
        run: python -m pip install -e ".[pk-structural]"
      - name: Analytic infusion, patient partition and synthetic fitting tests
        run: |
          python -m unittest discover -s tests -p 'test_iv_pk_structural.py' -v
          python -m unittest discover -s tests -p 'test_mavoglurant_structural_fit.py' -v
      - name: Original source SHA-verified 120-person / 196-qualified-occasion heldout evaluation
        run: python -m scripts.benchmark_mavoglurant_iv_structural
