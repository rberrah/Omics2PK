name: Cross-study NCI-60 measured GI50, RNA and metabolite comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export_public_nci60_twoomics.R"
      - "scripts/benchmark_public_nci60_twoomics.py"
      - "tests/test_nci60_twoomics.py"
      - ".github/workflows/nci60-twoomics-gi50.yml"
  push:
    paths:
      - "scripts/export_public_nci60_twoomics.R"
      - "scripts/benchmark_public_nci60_twoomics.py"
      - "tests/test_nci60_twoomics.py"
      - ".github/workflows/nci60-twoomics-gi50.yml"
permissions:
  contents: read
jobs:
  run-fixed-public-comparisons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mixOmics-org/mixOmics
          ref: 9f9fd66b69105fdb618b54588b638b567e85c0d6
          path: upstream/mixomics
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Mathelab/NCI60_GeneMetabolite_Data
          ref: 4c140708c18c41910458414a626b1a51d3dd2a85
          path: upstream/nci60-multiomics
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[benchmark]'
      - run: python -m unittest discover -s tests -p 'test_nci60_twoomics.py' -v
      - name: Guard cross-study matched cell lines, independently corroborate tumor classes
        run: Rscript scripts/export_public_nci60_twoomics.R upstream/mixomics upstream/nci60-multiomics temp_source
      - name: Frozen fold-only RNA vs metabolome vs both on real GI50 (3 correlated repetitions)
        run: python scripts/benchmark_public_nci60_twoomics.py --data temp_source --out nci60_twoomics_aggregate.json --repeats 3
      - name: Delete temporary public molecular and subject-level material
        if: always()
        run: rm -rf temp_source
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: nci60-cross-study-rna-metab-aggregate-only
          path: nci60_twoomics_aggregate.json
          retention-days: 14
