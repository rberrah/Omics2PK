name: Source reachability and real omics-PK validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_public_real_pk.py"
      - "scripts/qualify_peng_phh_source.py"
      - "scripts/validate_peng_rna_activity.py"
      - "scripts/diagnose_peng_expression_values.py"
      - "scripts/audit_epa_liver_rna_activity.py"
      - "scripts/inspect_epa_liver_crosswalk.py"
      - "scripts/validate_epa_liver_rna_cyp.py"
      - "src/omics2pk/epa_liver_cyp_validation.py"
      - "tests/test_epa_liver_cyp_validation.py"
      - "src/omics2pk/phh_cyp_evidence.py"
      - "tests/test_phh_cyp_evidence.py"
      - "tests/test_qualify_peng_phh_source.py"
      - ".github/workflows/real-omics-pk-proof.yml"
permissions:
  contents: read
jobs:
  source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe public primary article sources (structure only)
        run: python -m scripts.probe_public_real_pk

  peng-public-omics-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Synthetic tests for donor identities and source archive safety
        run: python -m unittest discover -s tests -p 'test_qualify_peng_phh_source.py' -v
      - name: Verify actual six-donor GEO plus native PHH functional supplement
        run: python -m scripts.qualify_peng_phh_source
      - name: Determine original GEO RNA matrix count semantics before normalization
        run: python -m scripts.diagnose_peng_expression_values

  exploratory-measured-cyp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install clean research package
        run: python -m pip install -e .
      - name: Test original CYP table matching and held-out donor contract
        run: python -m unittest discover -s tests -p 'test_phh_cyp_evidence.py' -v
      - name: Actual PHH RNA pseudobulk vs original measured CYP SCR/MFR (n=6, exploratory only)
        run: python -m scripts.validate_peng_rna_activity

  epa-official-liver-mrna-cyp:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Qualify real original US EPA 100-liver published RNA and CYP activity workbook
        run: |
          python -m scripts.audit_epa_liver_rna_activity
          python -m scripts.inspect_epa_liver_crosswalk

  epa-measured-100-donor-rna-cyp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install native research package (no external ML)
        run: python -m pip install -e .
      - name: Test real measured CYP / RNA 100-donor exact-match and heldout code on synthetic records
        run: python -m unittest discover -s tests -p 'test_epa_liver_cyp_validation.py' -v
      - name: Evaluate actual 100 original EPA human livers qPCR against measured CYP function
        run: python -m scripts.validate_epa_liver_rna_cyp
