name: Original HLC human liver RNA CYP and PGx research benchmark contract
on:
  pull_request:
    paths:
      - 'src/omics2pk/hlc_real_cyp_validation.py'
      - 'src/omics2pk/hlc_real_genomics_validation.py'
      - 'src/omics2pk/hlc_real_fullarray_validation.py'
      - 'scripts/benchmark_authorized_hlc_original.py'
      - 'tests/test_hlc_real_cyp_validation_contract.py'
      - '.github/workflows/hlc-actual-cyp-research-contract.yml'
      - 'docs/HLC_ORIGINAL_400_LIVER_CYP_RNA_GENOTYPE_RESULTS_20261018.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated scientific calculations using synthetic data only
        run: |
          python -m pip install -e .
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2' 'pandas==2.3.3'
      - name: Test original study scientific input gates and patient privacy without original source files
        run: python -m unittest discover -s tests -p 'test_hlc_real_cyp_validation_contract.py' -v
