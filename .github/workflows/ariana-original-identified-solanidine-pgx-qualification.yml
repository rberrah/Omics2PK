name: ARIANA original CYP2D6 solanidine metoprolol source schema qualification
on:
  pull_request:
    paths:
      - scripts/audit_ariana_original_source.py
      - .github/workflows/ariana-original-identified-solanidine-pgx-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-author-XLSX-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect pinned original author XLSX and source genomics/molecular/PK columns
        env:
          PYTHONPATH: "src:."
        run: |
          python -m scripts.audit_ariana_original_source > /tmp/author_sourced_schema.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/author_sourced_schema.json"))
          assert d["status"]=="ORIGINAL_ARIANA_CYP2D6_IDENTIFIED_SOLANIDINE_PGX_SOURCE_SCHEMA"
          assert d["original_author_patient_rows_not_printed_or_committed"]
          assert d["original_xlsx_SHA256"] and len(d["original_xlsx_SHA256"])==64
          assert len(d["source_sheet_structure"])>=1
          print(json.dumps(d,sort_keys=True,indent=2))
          PY
      - if: always()
        run: rm -f /tmp/author_sourced_schema.json
