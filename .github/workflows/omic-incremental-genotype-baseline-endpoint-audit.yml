name: PK and PD incremental omic value versus authentic genetic baseline - offline contracts
on:
  pull_request:
    paths:
      - "src/omics2pk/omic_incremental_endpoint_audit.py"
      - "tests/test_omic_incremental_endpoint_audit.py"
      - ".github/workflows/omic-incremental-genotype-baseline-endpoint-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-subjects-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: All model arms same source persons and true PK outcome, genotype and predose gates
        run: python -m unittest discover -s tests -p 'test_omic_incremental_endpoint_audit.py' -v
