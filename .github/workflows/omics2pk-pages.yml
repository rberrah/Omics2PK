name: Omics2PK static UI qualification
on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/test_omics2pk_pages.py'
      - '.github/workflows/omics2pk-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/test_omics2pk_pages.py'
      - '.github/workflows/omics2pk-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install exactly pinned PMx Fontsource variable font packages
        run: npm install --prefix site --ignore-scripts --no-audit --no-fund --omit=dev
      - name: Generate standalone static site and host original font assets locally
        run: |
          python site/build_site.py --out site/dist
          node site/scripts/bundle_fonts.mjs site/dist
      - name: Validate menu parity, links, theme, FR/EN and no clinical overclaims
        run: python -m unittest discover -s tests -p 'test_omics2pk_pages.py' -v
      - name: Verify bundled three original PMx families are real local WOFF2 fonts
        run: |
          test -f site/dist/index.html
          test -f site/dist/resources/index.html
          test -f site/dist/assets/styles.css
          test -s site/dist/assets/fonts/inter-latin-wght-normal.woff2
          test -s site/dist/assets/fonts/source-serif-4-latin-wght-normal.woff2
          test -s site/dist/assets/fonts/jetbrains-mono-latin-wght-normal.woff2
      - uses: actions/upload-artifact@v4
        with:
          name: omics2pk-static-pages-preview
          path: site/dist
          retention-days: 7
