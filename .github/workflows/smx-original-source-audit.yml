name: Original SMX article XML source audit
on:
  pull_request:
    paths:
      - 'scripts/probe_smx_original_article.py'
      - '.github/workflows/smx-original-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Audit public article table structure without exporting donor data
        run: python -m scripts.probe_smx_original_article
