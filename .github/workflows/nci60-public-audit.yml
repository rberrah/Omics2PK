name: Inspect public measured NCI-60 multidrug source
on:
  push:
    paths:
      - ".github/workflows/nci60-public-audit.yml"
      - "scripts/audit_public_multidrug.R"
  pull_request:
    paths:
      - ".github/workflows/nci60-public-audit.yml"
      - "scripts/audit_public_multidrug.R"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mixOmics-org/mixOmics
          ref: 9f9fd66b69105fdb618b54588b638b567e85c0d6
          path: upstream/mixomics
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Audit actual published ABC expression and measured GI50
        run: Rscript scripts/audit_public_multidrug.R upstream/mixomics
