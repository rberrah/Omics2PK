name: Native MultiOmics → Omics2PK exchange integration
on:
  push:
    paths:
      - ".github/workflows/native-multiomics-export.yml"
      - "scripts/build_native_multiomics_exchange.mjs"
      - "scripts/verify_native_multiomics_export.py"
      - "src/omics2pk/multiomics_pk_readiness.py"
      - "src/omics2pk/nca_targets.py"
      - "tests/test_multiomics_pk_readiness.py"
      - "src/omics2pk/omic_signature_contract.py"
      - "tests/test_omic_signature_contract.py"
      - "scripts/audit_multiomics_pk_readiness.py"
      - "scripts/build_native_multiomics_research_zip.mjs"
      - "scripts/audit_multiomics_research_zip.py"
  pull_request:
    paths:
      - ".github/workflows/native-multiomics-export.yml"
      - "scripts/build_native_multiomics_exchange.mjs"
      - "scripts/verify_native_multiomics_export.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-synthetic-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: rberrah/MultiOmics
          ref: 33f6853c4d852ac67f5c7dafa51e7213d2dc3bd6
          path: upstream/multiomics
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Reject unqualified transductive/group biological signatures
        run: python -m unittest discover -s tests -p 'test_omic_signature_contract.py' -v
      - name: Generate native exchange with actual MultiOmics browser producer
        run: node scripts/build_native_multiomics_exchange.mjs ./tmp_generated_exchange
      - name: Contract tests for genuine measured NCA and temporal omics anti-leakage
        run: python -m unittest discover -s tests -p 'test_multiomics_pk_readiness.py' -v
      - name: Validate actual MultiOmics V1 producer and assert raw counts and missing time are blocked
        run: python scripts/verify_native_multiomics_export.py ./tmp_generated_exchange
      - name: Build native MultiOmics end-user research ZIP with original JS packager
        run: node scripts/build_native_multiomics_research_zip.mjs ./tmp_native_multiomics_bundle.zip
      - name: Verify full ZIP source and actual exchange timestamps from independent Python reader
        run: python -m scripts.audit_multiomics_research_zip ./tmp_native_multiomics_bundle.zip
      - name: Do not retain assay-level synthetic demo matrices as CI artifacts
        run: rm -rf ./tmp_generated_exchange ./tmp_native_multiomics_bundle.zip
