name: Molecular–PK readiness and original specimen identity
on:
  push:
    paths:
      - "src/omics2pk/pk_readiness.py"
      - "src/omics2pk/multimodal_exchange_pk.py"
      - "src/omics2pk/cli.py"
      - "tests/test_pk_readiness.py"
      - "tests/test_multimodal_exchange_pk.py"
      - ".github/workflows/pk-readiness.yml"
  pull_request:
    paths:
      - "src/omics2pk/pk_readiness.py"
      - "src/omics2pk/multimodal_exchange_pk.py"
      - "src/omics2pk/cli.py"
      - "tests/test_pk_readiness.py"
      - "tests/test_multimodal_exchange_pk.py"
      - ".github/workflows/pk-readiness.yml"
permissions:
  contents: read
jobs:
  research-metadata-safety-no-human-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Source PK/PGx readiness without numpy or real patients
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_pk_readiness.py' -v
      - name: Compile and source-only checks
        run: python -m compileall -q src
