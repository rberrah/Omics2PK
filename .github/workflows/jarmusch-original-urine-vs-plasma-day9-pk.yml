name: Original Jarmusch urine and plasma predose same10 human PK nested benchmark
on:
  pull_request:
    paths:
      - "scripts/benchmark_original_jarmusch_urine_t0_nested.py"
      - "scripts/benchmark_original_jarmusch_nested_pk_germline.py"
      - "scripts/benchmark_jarmusch_temporal_plasma_nested.py"
      - ".github/workflows/jarmusch-original-urine-vs-plasma-day9-pk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-urine-plasma-pgx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Qualified source reader and regularized nested CV
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "scikit-learn>=1.5,<2" "h5py>=3.10,<4"
      - name: Download official GNPS study original public features
        run: python -m scripts.download_public_jarmusch_gnps /tmp/jarmusch_source.zip
      - name: Actual original same patients predose urine/plasma comparison
        env:
          PYTHONPATH: "src:."
        run: |
          python -m scripts.benchmark_original_jarmusch_urine_t0_nested /tmp/jarmusch_source.zip > /tmp/urine_results.json || {
            cat /tmp/urine_results.json
            exit 2
          }
          python - <<'PY'
          import json
          d=json.load(open("/tmp/urine_results.json"))
          assert d["status"]=="ORIGINAL_JARMUSCH_SAME10_URINE_PLASMA_T0_NESTED_DAY9_CLF"
          assert d["n_independent_patients_with_all_t0_specimens_and_observed_PK"]==10
          assert d["only_pre_drug_urine_t0_no_postdose_metabolite_target_leakage"]
          assert d["no_source_person_or_assay_identifiers_or_original_omics_exported"]
          assert len(d["results"])==4
          for matrix,v in d["results"].items():
            assert v["n_source_people"]==10
            for arm in v["models"].values():
              if arm["status"]=="MEASURED_ORIGINAL_PATIENT_HELDOUT_NESTED":
                assert arm["n_original_independent_people"]==10
                assert arm["no_source_individual_outcomes_or_predictions_printed"]
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - if: always()
        name: Delete biological source data, no upload
        run: rm -f /tmp/jarmusch_source.zip /tmp/urine_results.json
