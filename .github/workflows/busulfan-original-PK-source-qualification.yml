name: Busulfan original clinical PK source and patient-excluded omics benchmark contracts
on:
  pull_request:
    paths:
      - 'src/omics2pk/busulfan132_predose_pk.py'
      - 'scripts/audit_original_busulfan_and_jarmusch_PK_releases.py'
      - 'tests/test_busulfan132_predose_pk.py'
      - '.github/workflows/busulfan-original-PK-source-qualification.yml'
      - 'docs/BUSULFAN132_PROSPECTIVE_METABOLOME_PK_SOURCE_AND_INDEPENDENCE_20261018.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify published official JATS and supplementary source classes, never person rows
        run: python -m scripts.audit_original_busulfan_and_jarmusch_PK_releases
  only-fabricated-source-model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install public methods for private authorized original future data
        run: |
          python -m pip install -e .
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2'
      - name: No patient disclosure; fabricated repeated 132 humans and 841 features
        run: python -m unittest discover -s tests -p 'test_busulfan132_predose_pk.py' -v
