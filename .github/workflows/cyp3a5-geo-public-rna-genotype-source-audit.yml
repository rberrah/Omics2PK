name: Public CYP3A5 hepatocyte RNA versus genotype original GEO source crosswalk
on:
  pull_request:
    paths:
      - "scripts/audit_public_cyp3a5_geo_rna_genotype_join.py"
      - "tests/test_public_cyp3a5_geo_rna_genotype_join.py"
      - ".github/workflows/cyp3a5-geo-public-rna-genotype-source-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-GEO:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Fail-closed source sample crosswalk synthetic negative controls
        run: python -m unittest discover -s tests -p 'test_public_cyp3a5_geo_rna_genotype_join.py' -v
      - name: Check authentic original GSE124074 RNA and GSE147628 genotype public sample metadata only
        run: python scripts/audit_public_cyp3a5_geo_rna_genotype_join.py
