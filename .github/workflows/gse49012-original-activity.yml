name: Real public GEO liver miRNA to CYP3A activity original-source validation
# Original-source replay is on-demand: independently downloaded true GEO
# measurements presently FAIL published-paper phenotype parity. This source
# gate must report ABSTAIN, never a misleading passing biological benchmark.
# Mandatory PR offline contract CI still checks all synthetic source guards.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-geo-sample-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install editable Omics2PK and fixed PCA benchmark dependencies
        run: |
          python -m pip install -e .
          python -m pip install numpy==2.3.5 scikit-learn==1.7.2
      - name: Synthetic source identity, disease and heldout leakage contracts
        run: python -m unittest discover -s tests -p 'test_geo_cyp3a_mirna.py' -v
      - name: Replay actual official GEO GSE49012 liver microRNA and measured CYP3A activity
        run: python -m scripts.benchmark_original_geo_gse49012_mirna
