name: Real public GEO liver miRNA to CYP3A activity original-source validation
on:
  pull_request:
    paths:
      - 'src/omics2pk/geo_cyp3a_mirna.py'
      - 'scripts/benchmark_original_geo_gse49012_mirna.py'
      - 'tests/test_geo_cyp3a_mirna.py'
      - '.github/workflows/gse49012-original-activity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-geo-sample-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install editable Omics2PK research package
        run: python -m pip install -e .
      - name: Synthetic source identity, disease and heldout leakage contracts
        run: python -m unittest discover -s tests -p 'test_geo_cyp3a_mirna.py' -v
      - name: Replay actual official GEO GSE49012 liver microRNA and measured CYP3A activity
        run: python -m scripts.benchmark_original_geo_gse49012_mirna
