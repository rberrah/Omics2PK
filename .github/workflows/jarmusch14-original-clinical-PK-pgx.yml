name: Original Jarmusch14 measured clinical CYP PK and PGx source benchmark
on:
  pull_request:
    paths:
      - 'src/omics2pk/jarmusch14_public_clinical_pk.py'
      - 'tests/test_jarmusch14_public_clinical_pk.py'
      - '.github/workflows/jarmusch14-original-clinical-PK-pgx.yml'
      - 'docs/JARMUSCH14_PUBLIC_REAL_CLINICAL_PK_PGX_20261018.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-author-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install generic scientific models only, no original source snapshots or human records
        run: |
          python -m pip install -e .
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2'
      - name: Full synthetic 1423-analytical-record/14-person donor deduplication tests
        run: python -m unittest discover -s tests -p 'test_jarmusch14_public_clinical_pk.py' -v
      - name: Original real public Jarmusch clinical PGx plus measured day1/day9 PK, safe aggregate output only
        run: python -m omics2pk.jarmusch14_public_clinical_pk
