name: Optional MultiOmics variant-omic hypotheses to Omics2PK clinical-evidence boundary
on:
  pull_request:
    paths:
      - "src/omics2pk/multiomics_variant_evidence_consumer.py"
      - "tests/test_multiomics_variant_evidence_consumer.py"
      - ".github/workflows/multiomics-variant-evidence-consumer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Check research-only versioned sidecar no clinical or causal upgrade
        run: python -m unittest discover -s tests -p 'test_multiomics_variant_evidence_consumer.py' -v
