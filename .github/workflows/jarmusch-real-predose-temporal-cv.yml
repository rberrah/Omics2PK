name: Jarmusch original 11 paired day1 vs day9 plasma and true day9 midazolam CLF
on:
  pull_request:
    paths:
      - scripts/benchmark_jarmusch_temporal_plasma_nested.py
      - scripts/benchmark_original_jarmusch_nested_pk_germline.py
      - scripts/audit_original_jarmusch_compartments.py
      - scripts/validate_local_jarmusch14_gnps_biom_pk.py
      - .github/workflows/jarmusch-real-predose-temporal-cv.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-predose-original:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "scikit-learn>=1.5,<2" "h5py>=3.10,<4"
      - name: Qualified original Jarmusch 2019 public metabolomics source
        run: python -m scripts.download_public_jarmusch_gnps /tmp/original_jarmusch_gnps.zip
      - name: Qualify same people source predose plasma and true day9 PK under both clocks
        env:
          PYTHONPATH: "src:."
        run: |
          python -m scripts.benchmark_jarmusch_temporal_plasma_nested /tmp/original_jarmusch_gnps.zip > /tmp/original_day9_two_plasma_clocks.json || {
            cat /tmp/original_day9_two_plasma_clocks.json
            exit 2
          }
          python - <<'PY'
          import json
          d=json.load(open("/tmp/original_day9_two_plasma_clocks.json"))
          assert d["status"]=="ACTUAL_JARMUSCH_ORIGINAL_SAME11_DAY9_PK_PREDOSE_DAY1_VS_DAY9_PLASMA"
          assert d["n_original_unique_patients_with_both_predose_times"]==11
          assert d["primary_provenance_gate_passed"]
          assert d["no_individual_original_source_data_exported"]
          for source_day,out in d["results"].items():
            assert out["n_source_people"]==11
            baseline=out["models"]["weight_sex_PGx_only"]
            assert baseline["status"]=="MEASURED_ORIGINAL_PATIENT_HELDOUT_NESTED"
            for model in out["models"].values():
              if model["status"]=="MEASURED_ORIGINAL_PATIENT_HELDOUT_NESTED":
                assert model["n_original_independent_people"]==11
                assert model["no_source_individual_outcomes_or_predictions_printed"]
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - if: always()
        run: rm -f /tmp/original_jarmusch_gnps.zip /tmp/original_day9_two_plasma_clocks.json
