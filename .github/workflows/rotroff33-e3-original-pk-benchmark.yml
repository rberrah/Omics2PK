name: E3 real original 32 metformin PK persons vs matched predose 384 GC-TOF
on:
  pull_request:
    paths:
      - 'src/omics2pk/rotroff33_clinical_e3.py'
      - 'scripts/validate_rotroff33_original_metformin_clinical_e3.py'
      - 'tests/test_rotroff33_clinical_e3.py'
      - '.github/workflows/rotroff33-e3-original-pk-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-clinical-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned independent scientific numerical libraries
        run: |
          python -m pip install -e .
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2'
      - name: Test donor-heldout, nonleakage, synthetic PK responses and source privacy
        run: python -m unittest discover -s tests -p 'test_rotroff33_clinical_e3.py' -v
      - name: Benchmark ORIGINAL public 32 paired human metformin PK and predose metabolomics
        run: python -m scripts.validate_rotroff33_original_metformin_clinical_e3
