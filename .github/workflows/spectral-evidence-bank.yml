name: Offline spectral and transporter hypothesis evidence bank
on:
  pull_request:
    paths:
      - "src/omics2pk/spectral_knowledge_bank.py"
      - "tests/test_spectral_knowledge_bank.py"
      - "docs/SPECTRAL_REFERENCE_TRANSPORTER_ENZYME_PROTEOFORM_BANK_20261104.md"
      - ".github/workflows/spectral-evidence-bank.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectral-source-and-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install local research package (no spectral library download)
        run: python -m pip install -e .
      - name: Spectral matching chemistry, source rights, PTM and transporter evidence fail-closed
        run: python -m unittest discover -s tests -p 'test_spectral_knowledge_bank.py' -v
