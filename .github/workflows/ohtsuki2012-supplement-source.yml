name: Ohtsuki 2012 official supplement source audit

on:
  pull_request:
    paths:
      - "scripts/audit_ohtsuki2012_official_supplement.py"
      - "tests/test_ohtsuki2012_official_supplement.py"
      - ".github/workflows/ohtsuki2012-supplement-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Synthetic anti-overclaim tests
        run: python -m unittest tests.test_ohtsuki2012_official_supplement -v
      - name: Probe preregistered official publisher routes
        run: |
          python -m scripts.audit_ohtsuki2012_official_supplement             --out ohtsuki2012_official_supplement_source.json
      - name: Upload metadata-only source audit
        uses: actions/upload-artifact@v6
        with:
          name: ohtsuki2012-official-supplement-source-metadata-only
          path: ohtsuki2012_official_supplement_source.json
          retention-days: 14
