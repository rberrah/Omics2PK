name: Original mavoglurant held-human-out 2C NLME IIV-CL research proof
on:
  pull_request:
    paths:
      - "scripts/benchmark_mavoglurant_iv_nlme.py"
      - "tests/test_mavoglurant_iv_nlme.py"
      - "scripts/benchmark_mavoglurant_iv_structural.py"
      - "src/omics2pk/iv_pk_structural.py"
      - "pyproject.toml"
      - ".github/workflows/mavoglurant-heldout-nlme.yml"
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_mavoglurant_iv_nlme.py"
      - "tests/test_mavoglurant_iv_nlme.py"
      - "scripts/benchmark_mavoglurant_iv_structural.py"
      - "src/omics2pk/iv_pk_structural.py"
      - "pyproject.toml"
      - ".github/workflows/mavoglurant-heldout-nlme.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-2c-nlme:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned research PK dependencies
        run: python -m pip install -e ".[pk-structural]"
      - name: Synthetic NLME probability and holdout tests
        run: python -m unittest discover -s tests -p 'test_mavoglurant_iv_nlme.py' -v
      - name: SHA verified original mavoglurant 120-human fivefold NLME evaluation
        run: python -m scripts.benchmark_mavoglurant_iv_nlme
