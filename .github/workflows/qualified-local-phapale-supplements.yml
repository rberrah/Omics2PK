name: Original authorized Phapale Wiley supplement source contract (synthetic only)
on:
  pull_request:
    paths:
      - "scripts/audit_local_phapale_supplements.py"
      - "tests/test_local_phapale_supplements.py"
      - ".github/workflows/qualified-local-phapale-supplements.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit_local_phapale_supplements.py"
      - "tests/test_local_phapale_supplements.py"
      - ".github/workflows/qualified-local-phapale-supplements.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-provenance-contract-no-copyrighted-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test synthetic Word OLE and original SHA safety guards
        run: python -m unittest discover -s tests -p 'test_local_phapale_supplements.py' -v
      - name: Confirm original Wiley documents are never bundled into public repo
        run: |
          if find . -path '*/cptclpt2009296-sup-*.doc' -o -iname '*phapale*.zip' -o -iname '*paphale*.zip' | grep .; then
            echo "ERROR: copyrighted source in public checkout"
            exit 1
          fi
          echo "No original copyrighted Wiley supplements are published."
