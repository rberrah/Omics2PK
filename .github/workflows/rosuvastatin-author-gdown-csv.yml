name: Rosuvastatin n40 original author's public Google Drive CSV source qualification
on:
  pull_request:
    paths:
      - 'scripts/audit_rosuvastatin_author_gdown_csv.py'
      - 'tests/test_rosuvastatin_author_gdown_csv.py'
      - '.github/workflows/rosuvastatin-author-gdown-csv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install reproducible Google Drive public downloader
        run: python -m pip install 'gdown==5.2.0'
      - name: Verify no authors' clinical observations or Drive token are exported
        run: python -m unittest discover -s tests -p 'test_rosuvastatin_author_gdown_csv.py' -v
      - name: Retrieve five author original public processed CSVs using Google Drive large-download handling
        run: python -m scripts.audit_rosuvastatin_author_gdown_csv
