name: NUDT15 original MaveDB protein stability versus independent thiopurine cell PD
on:
  pull_request:
    paths:
      - "src/omics2pk/public_nudt15_variant_pd_benchmark.py"
      - "scripts/benchmark_public_nudt15_cell_PD.py"
      - "tests/test_public_nudt15_variant_pd_benchmark.py"
      - ".github/workflows/nudt15-public-mavedb-functional-pd.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-nudt15-paired-mave:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Test synthetic original-source and independent protein-position CV controls
        run: python -m unittest discover -s tests -p 'test_public_nudt15_variant_pd_benchmark.py' -v
      - name: Live source-pinned MaveDB NUDT15 known-variant protein versus cell PD benchmark
        run: |
          python scripts/benchmark_public_nudt15_cell_PD.py > /tmp/nudt15_source_aggregate.json || { cat /tmp/nudt15_source_aggregate.json; exit 2; }
          python - <<'PY'
          import json
          o=json.load(open("/tmp/nudt15_source_aggregate.json"))
          assert o["status"]=="PUBLIC_NUDT15_VARIANT_MATCHED_CELL_LINE_PD_NOT_HUMAN_PATIENT_TOXICITY"
          assert o["n_paired_missense_variants"]==2825
          assert o["n_source_MaveDB_paired_score_set_rows"]==3015\n          assert o["n_original_nonmissense_or_unparsed_variants"]==20\n          assert o["n_rows_with_missing_any_scores"]==170
          assert o["functional_measure_not_same_as_protein_stability"]
          assert o["not_original_human_PK_or_clinical_toxicity"]
          assert len(o["held_position_out_methods"])==4
          assert o["source_fetched_live_no_variant_table_committed"]
          print(json.dumps(o,indent=2,sort_keys=True))
          PY
      - name: Remove aggregate metadata report
        if: always()
        run: rm -f /tmp/nudt15_source_aggregate.json
