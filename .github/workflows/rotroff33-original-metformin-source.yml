name: E3 original Rotroff33 metformin public omics-PK matrix qualification
on:
  pull_request:
    paths:
      - 'scripts/audit_rotroff33_metformin_original_pk_omics.py'
      - 'tests/test_rotroff33_metformin_original_pk_omics.py'
      - 'scripts/audit_rotroff33_crosssheet_pk_omics.py'
      - 'tests/test_rotroff33_crosssheet_pk_omics.py'
      - 'scripts/audit_rotroff33_original_sample_naming.py'
      - 'tests/test_rotroff33_original_sample_naming.py'
      - '.github/workflows/rotroff33-original-metformin-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-scientific-source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run synthetic patient-index and original PK/omics source gates
        run: python -m unittest discover -s tests -p 'test_rotroff33_metformin_original_pk_omics.py' -v
      - name: Test safe source crosssheet ID overlap recognition on fabricated records
        run: python -m unittest discover -s tests -p 'test_rotroff33_crosssheet_pk_omics.py' -v
      - name: Inspect actual publisher n33 original Metformin study supplements without exporting rows
        run: python -m scripts.audit_rotroff33_metformin_original_pk_omics
      - name: Audit full original source supplement wide matrices and matched clinical PK table keys without exporting ID labels
        run: python -m scripts.audit_rotroff33_crosssheet_pk_omics
      - name: Test that anonymized clinical/omics source sample key shapes never publish identifiers
        run: python -m unittest discover -s tests -p 'test_rotroff33_original_sample_naming.py' -v
      - name: Examine original high-dimensional and n33 clinical source timepoint/sample naming patterns only
        run: python -m scripts.audit_rotroff33_original_sample_naming
