name: Inductive SWEET-inspired candidate — synthetic tests
on:
  pull_request:
    paths:
      - "src/omics2pk/inductive_sweet.py"
      - "src/omics2pk/transcriptome_preprocessing.py"
      - "src/omics2pk/frozen_sweet_pipeline.py"
      - "src/omics2pk/hlc_sweet_activity_benchmark.py"
      - "src/omics2pk/hlc_authorized_sweet_bridge.py"
      - "src/omics2pk/hlc_synapse_same_donor_gate.py"
      - "tests/test_inductive_sweet.py"
      - "tests/test_transcriptome_preprocessing.py"
      - "tests/test_frozen_sweet_pipeline.py"
      - "tests/test_hlc_sweet_activity_benchmark.py"
      - "tests/test_hlc_authorized_sweet_bridge.py"
      - "tests/test_hlc_synapse_same_donor_gate.py"
      - "pyproject.toml"
      - "scripts/pilot_inductive_public.py"
      - "tests/test_crossfit.py"
      - ".github/workflows/inductive-sweet.yml"
  push:
    paths:
      - "src/omics2pk/inductive_sweet.py"
      - "src/omics2pk/transcriptome_preprocessing.py"
      - "src/omics2pk/frozen_sweet_pipeline.py"
      - "src/omics2pk/hlc_sweet_activity_benchmark.py"
      - "src/omics2pk/hlc_authorized_sweet_bridge.py"
      - "src/omics2pk/hlc_synapse_same_donor_gate.py"
      - "tests/test_inductive_sweet.py"
      - "tests/test_transcriptome_preprocessing.py"
      - "tests/test_frozen_sweet_pipeline.py"
      - "tests/test_hlc_sweet_activity_benchmark.py"
      - "tests/test_hlc_authorized_sweet_bridge.py"
      - "tests/test_hlc_synapse_same_donor_gate.py"
      - "pyproject.toml"
      - ".github/workflows/inductive-sweet.yml"
permissions:
  contents: read
jobs:
  synthetic-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[sweet-inductive]'
      - run: python -m unittest discover -s tests -p test_inductive_sweet.py -v
      - run: python -m unittest discover -s tests -p test_crossfit.py -v
      - run: python -m unittest discover -s tests -p test_transcriptome_preprocessing.py -v
      - run: python -m unittest discover -s tests -p test_frozen_sweet_pipeline.py -v
      - run: python -m unittest discover -s tests -p test_hlc_sweet_activity_benchmark.py -v
      - run: python -m unittest discover -s tests -p test_hlc_authorized_sweet_bridge.py -v
      - run: python -m unittest discover -s tests -p test_hlc_synapse_same_donor_gate.py -v
      - uses: actions/checkout@v5
        with:
          repository: SysMednet/SWEET
          ref: cf064eb5f5b996c40bba3cce507384f6c0fdecb5
          path: upstream/sweet
          persist-credentials: false
      - name: Public expression-only inductive diagnostic
        run: python scripts/pilot_inductive_public.py --upstream upstream/sweet --report public_inductive_diagnostic.json
      - uses: actions/upload-artifact@v6
        with:
          name: public-inductive-diagnostic
          path: public_inductive_diagnostic.json
          retention-days: 14
