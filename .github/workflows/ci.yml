name: Offline contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # Dependency-free contract job: installs the package with no dependencies, so
  # it proves the offline contracts hold without numpy, pandas or pytest. Test
  # modules needing those must raise unittest.SkipTest at import, not error.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m compileall -q src

  # The `offline` job can only SKIP pytest-style tests, so this job actually
  # executes them. Without it, a function-based test could be silently inert.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m pip install pytest numpy pandas scipy openpyxl scikit-learn xgboost
      - name: Run the pytest-based contract modules
        run: >-
          python -m pytest -q
          tests/test_public_data_evidence_registry.py
          tests/test_ariana_published_reconciliation.py
          tests/test_muller2026_potato_meal_qualification.py
          tests/test_h5_solanidine_marker_robustness.py
          tests/test_h1_ariana_incremental_omic_value.py
          tests/test_mechanistic_graph_selection.py
          tests/test_knowledge_graph_source_qualification.py
          tests/test_h2a_hlc_selection_comparison.py
          tests/test_hybrid_mechanistic_selection.py
          tests/test_h2d_hybrid_runner.py
          tests/test_merge_h2a_parts.py
          tests/test_selected_probe_qualification.py
          tests/test_probe_identity_qualification.py
          tests/test_destroyed_signal_replacement.py
          tests/test_ariana_mechanistic_and_hybrid_arms.py
      - name: Fail if a pytest module was collected but ran nothing
        run: |
          set -euo pipefail
          # A module that skips at import would report 0 tests and still exit 0,
          # which is exactly the silent-inertness this job exists to catch.
          count=$(python -m pytest -q --collect-only \
            tests/test_public_data_evidence_registry.py \
            tests/test_ariana_published_reconciliation.py \
            tests/test_muller2026_potato_meal_qualification.py \
            tests/test_h5_solanidine_marker_robustness.py \
            tests/test_h1_ariana_incremental_omic_value.py \
            tests/test_mechanistic_graph_selection.py \
            tests/test_knowledge_graph_source_qualification.py \
            tests/test_h2a_hlc_selection_comparison.py \
            tests/test_hybrid_mechanistic_selection.py \
            tests/test_h2d_hybrid_runner.py \
            tests/test_merge_h2a_parts.py \
            tests/test_selected_probe_qualification.py \
            tests/test_probe_identity_qualification.py \
            tests/test_destroyed_signal_replacement.py \
            tests/test_ariana_mechanistic_and_hybrid_arms.py \
            | grep -c '::' || true)
          echo "collected $count pytest tests"
          if [ "$count" -lt 575 ]; then
            echo "ERROR: expected at least 575 collected tests, got $count." >&2
            exit 1
          fi
