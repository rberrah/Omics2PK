name: Jarmusch original selected public GNPS ions precursor mz and RT identity audit
on:
  pull_request:
    paths:
      - scripts/audit_original_jarmusch_selected_ion_mz_rt.py
      - .github/workflows/jarmusch-original-selected-ion-mz-rt.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-ion-chemistry-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Acquire actual GNPS original task public re-export
        run: python -m scripts.download_public_jarmusch_gnps /tmp/original_gnps.zip
      - name: Match original public MS1 scan IDs to MS2 precursor and RT, no participant content
        run: |
          python -m scripts.audit_original_jarmusch_selected_ion_mz_rt /tmp/original_gnps.zip > /tmp/original_nonpatient_ion_mz_rt.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/original_nonpatient_ion_mz_rt.json"))
          assert d["status"]=="PUBLIC_GNPS_FEATURE_MZ_RT_IDENTITY_AUDIT_NO_PATIENT_DATA"
          assert d["n_requested_original_MS1_feature_ids"]==11
          assert d["no_patient_data_or_original_intensities_in_output"]
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - if: always()
        run: rm -f /tmp/original_gnps.zip /tmp/original_nonpatient_ion_mz_rt.json
