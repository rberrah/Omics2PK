name: Repository branch hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-hygiene.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  prune-fully-merged:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only fully merged unprotected branches
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const openPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "open", per_page: 100 }
            );
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === owner + "/" + repo)
                .map(pr => pr.head.ref)
            );

            const deleted = [];
            const preserved = [];
            const failed = [];

            for (const branch of branches) {
              if (branch.name === defaultBranch) {
                preserved.push({ branch: branch.name, reason: "default" });
                continue;
              }
              if (branch.protected) {
                preserved.push({ branch: branch.name, reason: "protected" });
                continue;
              }
              if (openHeads.has(branch.name)) {
                preserved.push({ branch: branch.name, reason: "open-pr" });
                continue;
              }

              let comparison;
              try {
                const response = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: defaultBranch,
                  head: branch.name,
                  per_page: 1
                });
                comparison = response.data;
              } catch (error) {
                failed.push({
                  branch: branch.name,
                  stage: "compare",
                  status: error.status ?? null,
                  message: error.message
                });
                continue;
              }

              if ((comparison.ahead_by ?? 0) !== 0) {
                preserved.push({
                  branch: branch.name,
                  reason: "unmerged-ahead-" + comparison.ahead_by
                });
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: "heads/" + branch.name
                });
                deleted.push(branch.name);
              } catch (error) {
                failed.push({
                  branch: branch.name,
                  stage: "delete",
                  status: error.status ?? null,
                  message: error.message
                });
              }
            }

            core.summary
              .addHeading("Safe merged-branch hygiene")
              .addRaw("Deleted fully merged branches: **" + deleted.length + "**\n\n")
              .addRaw("Preserved branches: **" + preserved.length + "**\n\n")
              .addRaw("Failures: **" + failed.length + "**\n\n");

            if (deleted.length) {
              core.summary.addDetails(
                "Deleted",
                deleted.map(name => "- " + name).join("\n")
              );
            }
            if (preserved.length) {
              core.summary.addDetails(
                "Preserved",
                preserved.map(x => "- " + x.branch + ": " + x.reason).join("\n")
              );
            }
            if (failed.length) {
              core.summary.addDetails(
                "Failures",
                failed.map(x =>
                  "- " + x.branch + " (" + x.stage + "): " +
                  (x.status ?? "") + " " + x.message
                ).join("\n")
              );
            }
            await core.summary.write();

            if (failed.length) {
              core.setFailed("Could not safely process " + failed.length + " branch(es).");
            }
