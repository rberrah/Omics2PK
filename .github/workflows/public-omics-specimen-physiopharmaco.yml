name: Public-only sampling tissue and physiopharmacology qualification (offline)
on:
  pull_request:
    paths:
      - "src/omics2pk/specimen_physiopharmaco_gate.py"
      - "tests/test_specimen_physiopharmaco_gate.py"
      - ".github/workflows/public-omics-specimen-physiopharmaco.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: No blood RNA equals liver CYP, no postdose plasma equals predose, no engineered cell equals patient
        run: python -m unittest discover -s tests -p 'test_specimen_physiopharmaco_gate.py' -v
