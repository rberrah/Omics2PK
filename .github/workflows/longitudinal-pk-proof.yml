name: Public longitudinal PK source and event qualification
on:
  pull_request:
    paths:
      - "src/omics2pk/longitudinal_pk_contract.py"
      - "scripts/qualify_public_theoph_pk.py"
      - "scripts/audit_nlmixr2_longitudinal.py"
      - "tests/test_longitudinal_pk_contract.py"
      - ".github/workflows/longitudinal-pk-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/omics2pk/longitudinal_pk_contract.py"
      - "scripts/qualify_public_theoph_pk.py"
      - "scripts/audit_nlmixr2_longitudinal.py"
      - "tests/test_longitudinal_pk_contract.py"
      - ".github/workflows/longitudinal-pk-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install research package
        run: python -m pip install -e .
      - name: Verify PK longitudinal multi-dose and future omics leakage guards
        run: python -m unittest discover -s tests -p 'test_longitudinal_pk_contract.py' -v
      - name: Original human single dose theophylline observed timecourses
        run: python -m scripts.qualify_public_theoph_pk
  public-multidose-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install R original source format reader
        run: python -m pip install pyreadr==0.5.4
      - name: Audit pinned nlmixr2data single/multidose and separate warfarin PK/PD source records
        run: python -m scripts.audit_nlmixr2_longitudinal
