name: Original GNPS MS1 PK synthetic-only qualification
on:
  push:
    paths:
      - "scripts/validate_local_jarmusch14_gnps_biom_pk.py"
      - "tests/test_jarmusch14_original_gnps_biom_pk.py"
      - ".github/workflows/jarmusch14-gnps-biom-source.yml"
  pull_request:
    paths:
      - "scripts/validate_local_jarmusch14_gnps_biom_pk.py"
      - "tests/test_jarmusch14_original_gnps_biom_pk.py"
      - ".github/workflows/jarmusch14-gnps-biom-source.yml"
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m pip install numpy==2.3.5 scikit-learn==1.7.2 scipy==1.16.3 h5py==3.15.1
      - run: python -m unittest discover -s tests -p "test_jarmusch14_original_gnps_biom_pk.py" -v
      - run: python -m compileall -q scripts src
